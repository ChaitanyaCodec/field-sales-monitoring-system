<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sales Monitoring Dashboard</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>

<body>

<div class="container mt-5">

    <!-- Dashboard Heading -->
    <h1 class="mb-4">
        Field Sales Monitoring Dashboard
    </h1>

    <!-- Statistics Cards -->
    <div class="row">

        <!-- Total Employees -->
        <div class="col-md-3 mb-3">
            <div class="card">
                <div class="card-body">
                    <h5>Total Employees</h5>
                    <h2>{{ total_employees }}</h2>
                </div>
            </div>
        </div>

        <!-- Total Customers -->
        <div class="col-md-3 mb-3">
            <div class="card">
                <div class="card-body">
                    <h5>Total Customers</h5>
                    <h2>{{ total_customers }}</h2>
                </div>
            </div>
        </div>

        <!-- Today's Attendance -->
        <div class="col-md-3 mb-3">
            <div class="card">
                <div class="card-body">
                    <h5>Today's Attendance</h5>
                    <h2>{{ today_attendance }}</h2>
                </div>
            </div>
        </div>

        <!-- Today's Visits -->
        <div class="col-md-3 mb-3">
            <div class="card">
                <div class="card-body">
                    <h5>Today's Visits</h5>
                    <h2>{{ today_visits }}</h2>
                </div>
            </div>
        </div>

    </div>

    <!-- Completed Visits -->
    <div class="card mt-4">
        <div class="card-body">
            <h4>Completed Visits</h4>
            <h2>{{ completed_visits }}</h2>
        </div>
    </div>

</div>

</body>
</html>
