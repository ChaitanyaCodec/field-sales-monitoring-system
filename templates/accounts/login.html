{% extends 'base.html' %}

{% block content %}
<h2>Login</h2>

<form method="post">
    {% csrf_token %}

    {# Displays wrong username/password notifications #}
    {% if form.non_field_errors %}
        <div class="alert alert-danger" style="color: red; margin-bottom: 15px;">
            {% for error in form.non_field_errors %}
                <p>{{ error }}</p>
            {% endfor %}
        </div>
    {% endif %}

    {{ form.as_p }}

    <button type="submit">Login</button>
</form>
{% endblock %}
